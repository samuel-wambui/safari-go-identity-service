spring.application.name=identity-service

server.port=${SERVER_PORT:8081}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:true}
eureka.instance.instance-id=${spring.application.name}:${server.port}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/identity_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:samuel}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Samuel@1999}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${SPRING_FLYWAY_BASELINE_VERSION:0}

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:samuelngari13@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:sqqp kguh flje ofnv}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:true}

iam.email.delivery-enabled=${IAM_EMAIL_DELIVERY_ENABLED:true}
iam.password-reset.token-minutes=${IAM_PASSWORD_RESET_TOKEN_MINUTES:30}
iam.login-verification.code-minutes=${IAM_LOGIN_VERIFICATION_CODE_MINUTES:10}
