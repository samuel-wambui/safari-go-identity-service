<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

</head>
<body>

                <circle cx="32" cy="32" r="24"></circle>
                <path d="M32 9v46M9 32h46M32 17l7 15-7 15-7-15 7-15Z"></path>
                <path d="M39 32H25"></path>
            </svg>
            <span>SafariGo</span>
        </div>
        <div class="result-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
                <path d="M12 8v5"></path>
                <path d="M12 17h.01"></path>
                <circle cx="12" cy="12" r="9"></circle>
            </svg>
        </div>
        <h1 id="result-title">We couldn't complete authentication</h1>
        <p>Return to WhatsApp and request a new secure link.</p>
    </section>
</main>
</body>
</html>
