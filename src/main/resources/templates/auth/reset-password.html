<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>SafariGo - Reset password</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <script defer th:src="@{/js/auth.js}"></script>
</head>
<body>
<main class="auth-shell">
    <section class="auth-art" aria-label="SafariGo travel planning">
        <div class="brand-lockup brand-lockup-light">
            <svg class="brand-icon" viewBox="0 0 64 64" role="img" aria-label="SafariGo">
                <circle cx="32" cy="32" r="24"></circle>
                <path d="M32 9v46M9 32h46M32 17l7 15-7 15-7-15 7-15Z"></path>
                <path d="M39 32H25"></path>
            </svg>
            <span>SafariGo</span>
        </div>
        <svg class="hero-route-overlay" viewBox="0 0 620 920" aria-hidden="true" focusable="false">
            <path class="hero-route-path" d="M430 94C318 156 484 245 360 338C260 413 490 505 376 616C298 692 422 746 338 832"></path>
            <g class="hero-airplane" transform="translate(405 90) rotate(24)">
                <path d="M4 22 62 4 42 33 52 58 30 42 13 54 22 34 4 22Z"></path>
                <path d="M22 34 42 33"></path>
            </g>
            <g class="hero-pin" transform="translate(304 792)">
                <path d="M34 2C19.6 2 8 13.6 8 28c0 20 26 50 26 50s26-30 26-50C60 13.6 48.4 2 34 2Z"></path>
                <circle cx="34" cy="28" r="8"></circle>
            </g>
        </svg>
        <div class="auth-art-copy">
            <h1>Your journey starts here</h1>
            <p>AI-powered travel planning in Kenya and across East Africa. Seamless, secure, and on WhatsApp.</p>
        </div>
    </section>

    <section class="auth-main" aria-labelledby="reset-title">
        <div class="mobile-brand brand-lockup">
            <svg class="brand-icon" viewBox="0 0 64 64" role="img" aria-label="SafariGo">
                <circle cx="32" cy="32" r="24"></circle>
                <path d="M32 9v46M9 32h46M32 17l7 15-7 15-7-15 7-15Z"></path>
                <path d="M39 32H25"></path>
            </svg>
            <span>SafariGo</span>
        </div>

        <section class="auth-card">
            <header class="card-heading">
                <h2 id="reset-title">Create new password</h2>
                <p>Use a password that is hard to guess</p>
            </header>

            <div class="alert alert-error" role="alert" th:if="${error}" th:text="${error}">
                This reset link is invalid or expired.
            </div>

            <form class="auth-form" method="post" th:action="@{/reset-password}" th:object="${resetPasswordRequest}" data-auth-form th:if="${tokenUsable}">
                <input type="hidden" th:field="*{token}">

                <label for="newPassword">New password</label>
                <div class="password-field">
                    <input id="newPassword" type="password" th:field="*{password}" autocomplete="new-password" required minlength="8" maxlength="72">
                    <button class="password-toggle" type="button" data-password-toggle aria-label="Show password" aria-controls="newPassword">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>

                <label for="confirmPassword">Confirm password</label>
                <div class="password-field">
                    <input id="confirmPassword" type="password" th:field="*{confirmPassword}" autocomplete="new-password" required minlength="8" maxlength="72">
                    <button class="password-toggle" type="button" data-password-toggle aria-label="Show password" aria-controls="confirmPassword">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>

                <button class="primary-button" type="submit" data-submit-button>
                    <span>Update password</span>
                </button>
            </form>

            <p class="switch-copy"><a class="text-link" th:href="@{/login}">Back to sign in</a></p>
        </section>
    </section>
</main>
</body>
</html>
