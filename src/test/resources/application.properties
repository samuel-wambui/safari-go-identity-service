spring.application.name=identity-service
security.jwt.issuer=http://localhost:8080

spring.datasource.url=jdbc:h2:mem:identity_service_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Keep integration tests deterministic even when a developer .env file defines
# the generic client-id/client-secret placeholders used by the runtime profile.
iam.oauth2.clients.travel-web.client-id=travel-web-bff
iam.oauth2.clients.travel-web.client-secret=travel-web-dev-secret
iam.oauth2.clients.n8n-orchestrator.client-id=n8n-orchestrator
iam.oauth2.clients.n8n-orchestrator.client-secret=n8n-dev-secret
